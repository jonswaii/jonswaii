  <div class="wrap bar mono">
    <a class="rec home" href="./"><i></i> Jon<span class="full">&nbsp;Swaii</span></a>

<main>
  <div class="pagehead"><div class="wrap"><h1>Contact</h1><p>Booking, sync licensing, beats, commissions, merch, press. Hit me here.</p></div></div>
  <section id="contact" style="border-bottom:0;padding-top:clamp(40px,6vw,64px)">
    <div class="wrap">
      
      <!-- EDIT: replace YOUR_FORM_ID with a Formspree form code -->
      <form id="contact-form" method="POST" action="https://formspree.io/f/YOUR_FORM_ID" class="rv">
        <input type="hidden" name="_subject" value="New message from jonswaii site">
        <p class="hidden"><label>Leave blank <input name="_gotcha" tabindex="-1" autocomplete="off"></label></p>
        <label><span class="mono">Name</span><input id="c-name" name="name" required autocomplete="name"></label>
        <label><span class="mono">Email</span><input id="c-email" name="email" type="email" required autocomplete="email"></label>
        <label class="full"><span class="mono">What's this about</span>
          <select id="c-type" name="type"><option>Booking / show</option><option>Sync licensing</option><option>Beats</option><option>Art / commission</option><option>Merch</option><option>Press / interview</option><option>Collab</option><option>Book updates</option><option>Something else</option></select>
        </label>
        <label class="full"><span class="mono">Message</span><textarea id="c-msg" name="message" required></textarea></label>
        <div class="full"><button class="pill" id="c-send" type="submit">Send it</button><p id="c-status" role="status"></p></div>
      </form>

    </div>
  </section>

</main>
